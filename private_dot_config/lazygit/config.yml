disableStartupPopups: true
notARepository: "skip"
promptToReturnFromSubprocess: false
git:
    pagers:
        - pager: delta --dark --paging=never
customCommands:
    - key: C
      description: "Commit with AI message"
      context: files
      prompts:
          - type: input
            title: Commit message
            key: CommitMessage
            initialValue: '{{ runCommand "gitscribe commit --output-only" }}'
          - type: confirm
            title: Commit with AI message?
            body: "{{ .Form.CommitMessage }}"
      command: git commit -m {{ .Form.CommitMessage | quote }}
gui:
    theme:
        activeBorderColor:
            - "#31748f"
            - bold

        inactiveBorderColor:
            - "#6e6a86"

        searchingActiveBorderColor:
            - "#ebbcba"
            - bold

        optionsTextColor:
            - "#9ccfd8"

        selectedLineBgColor:
            - "#31748f"

        inactiveViewSelectedLineBgColor:
            - "#26233a"
            - bold

        cherryPickedCommitFgColor:
            - "#1f1d2e"

        cherryPickedCommitBgColor:
            - "#ebbcba"

        markedBaseCommitFgColor:
            - "#9ccfd8"

        markedBaseCommitBgColor:
            - "#f6c177"

        unstagedChangesColor:
            - "#eb6f92"

        defaultFgColor:
            - "#e0def4"
